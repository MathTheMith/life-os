# Old Life OS address, kept only to send everything to the new domain.
# The certificate stays so the HTTPS redirect works without a browser warning.
server {
    server_name 46.224.119.108.nip.io;

    location / {
        return 301 https://os.replayto.com$request_uri;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/46.224.119.108.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/46.224.119.108.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    server_name 46.224.119.108.nip.io;
    return 301 https://os.replayto.com$request_uri;
}
