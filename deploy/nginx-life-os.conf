server {
    server_name 46.224.119.108.nip.io;

    root /var/www/life-os;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A "claude" chat message waits synchronously on the Claude Code CLI
        # (possibly doing real web research), well past nginx's default 60s.
        proxy_read_timeout 170s;
        proxy_send_timeout 170s;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/46.224.119.108.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/46.224.119.108.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = 46.224.119.108.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 46.224.119.108.nip.io;
    return 404; # managed by Certbot


}