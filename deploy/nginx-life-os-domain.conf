# Life OS on its own domain. The nip.io site (sites-available/life-os) stays
# up in parallel until the launcher APK is rebuilt with this URL.
server {
    listen 80;
    listen [::]:80;
    server_name os.replayto.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://os.replayto.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name os.replayto.com;

    ssl_certificate     /etc/letsencrypt/live/os.replayto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.replayto.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/life-os;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A chat message waits on the Claude Code CLI, well past nginx's default 60s.
        proxy_read_timeout 170s;
        proxy_send_timeout 170s;
    }

    location /dl/ {
        alias /var/www/dl/;
        default_type application/vnd.android.package-archive;
        autoindex off;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
